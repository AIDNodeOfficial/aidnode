name: Validate and Publish AIDNode MCP

# Manual only; normal commits do not publish a registry listing.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-and-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out registry listing
        uses: actions/checkout@v4

      - name: Check public health
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --retry 2 --max-time 20 'https://botstop-dev.botstop-dev-lab-2026.workers.dev/health' | jq -e '.ok == true and .name == "AIDNode" and .live_payments == false' >/dev/null

      - name: Check remote MCP initialize
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --max-time 20 'https://botstop-dev.botstop-dev-lab-2026.workers.dev/mcp' \
            -H 'Content-Type: application/json' \
            -H 'Accept: application/json, text/event-stream' \
            --data '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"aidnode-registry-preflight","version":"1.0.0"}}}' \
            | jq -e '.result.serverInfo.name == "aidnode"' >/dev/null

      - name: Download official MCP publisher
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error --retry 2 \
            'https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_linux_amd64.tar.gz' \
            | tar xz mcp-publisher
          chmod +x ./mcp-publisher

      - name: Validate server.json
        run: ./mcp-publisher validate server.json

      - name: Authenticate with GitHub OIDC
        run: ./mcp-publisher login github-oidc

      - name: Publish to official MCP Registry
        run: ./mcp-publisher publish server.json
