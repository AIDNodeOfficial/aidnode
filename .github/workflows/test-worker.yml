name: Test AIDNode Worker engines
on:
  pull_request:
    paths: ['src/**', 'test/**', 'package.json', '.github/workflows/test-worker.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check src/worker.js
      - run: npm test
